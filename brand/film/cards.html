<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weave film cards</title>
<style>
  @font-face {
    font-family: "Roboto Flex Film";
    src: url("../../assets/RobotoFlex.ttf") format("truetype");
    font-weight: 100 1000;
    font-stretch: 25% 151%;
  }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Roboto Flex Film", sans-serif;
  }
  .card {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
  }
  .card[data-on="true"] {
    display: grid;
  }
  .line {
    margin: 0;
    font-size: 88px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .line span {
    display: inline-block;
    margin-right: 0.26em;
  }
  .line span:last-child {
    margin-right: 0;
  }
  .lockup {
    display: grid;
    justify-items: center;
    gap: 36px;
  }
  .lockup .name {
    display: flex;
    align-items: center;
    gap: 34px;
    font-size: 132px;
    font-weight: 700;
    font-stretch: 112%;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .lockup svg {
    width: 132px;
    height: 132px;
  }
  .lockup p {
    margin: 0;
    color: #cfcfcf;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0;
  }
</style>
</head>
<body>
<div class="card" id="line"><p class="line"></p></div>
<div class="card" id="lockup">
  <div class="lockup">
    <div class="name">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#ffffff"/>
        <path d="M16 48.78 8 15.22H16.83L22.85 43.03L21.43 41.98H25.15L23.54 43.03L28.09 16.41H35.03L28.74 48.78ZM35.95 48.78 29.2 16.41H36.51L41.84 43.03L40.23 41.98H43.72L42.53 43.03L47.72 15.22H56L48.97 48.78Z" fill="#000000"/>
      </svg>
      <span>Weave</span>
    </div>
    <p>Designed by ailuruth</p>
  </div>
</div>
<script>
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const WORD_GAP_S = 0.16;
  const WORD_IN_S = 0.42;
  let shown = "";
  window.film = (scene, text, t) => {
    for (const card of document.querySelectorAll(".card")) card.dataset.on = "false";
    if (scene === "line") {
      const card = document.getElementById("line");
      card.dataset.on = "true";
      const line = card.querySelector(".line");
      if (shown !== text) {
        shown = text;
        line.replaceChildren(...text.split(" ").map((word) => {
          const span = document.createElement("span");
          span.textContent = word;
          return span;
        }));
      }
      [...line.children].forEach((span, index) => {
        const k = ease((t - 0.12 - index * WORD_GAP_S) / WORD_IN_S);
        span.style.opacity = String(Math.min(1, k * 1.6));
        span.style.fontWeight = String(Math.round(180 + k * 320));
        span.style.fontStretch = `${(82 + k * 22).toFixed(1)}%`;
      });
      return;
    }
    const card = document.getElementById("lockup");
    card.dataset.on = "true";
    const k = ease(t / 0.7);
    const name = card.querySelector(".name");
    name.style.opacity = String(k);
    name.style.transform = `scale(${(0.96 + k * 0.04).toFixed(4)})`;
    card.querySelector("p").style.opacity = String(ease((t - 0.8) / 0.6));
  };
</script>
</body>
</html>
